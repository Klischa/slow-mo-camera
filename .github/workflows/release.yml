name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # Trigger on tags starting with 'v' (v1.0.0, v2.1.0, etc.)
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore (if provided)
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "Keystore secret not set, building unsigned/default APK"
          fi

      - name: Build APK
        run: |
          if [ "${{ steps.decode_keystore.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug assembleRelease
          fi
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
